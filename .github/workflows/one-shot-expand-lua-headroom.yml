name: One-shot Lua headroom fix

on:
  push:
    branches:
      - fix/lua-local-limit-2
    paths:
      - .github/workflows/one-shot-expand-lua-headroom.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lua-local-limit-2

      - name: Convert top-level SCB helpers to globals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('SoloCraftBots.lua')
          text = path.read_text(encoding='utf-8')
          patched, count = re.subn(r'(?m)^local function (SCB_[A-Za-z0-9_]+)\(', r'function \1(', text)
          if count < 20:
              raise SystemExit(f'Expected many top-level SCB helpers, changed only {count}')
          path.write_text(patched, encoding='utf-8')
          print(f'Converted {count} top-level SCB helper declarations')
          PY

      - name: Install Lua and compile
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          luac5.1 -p SoloCraftBots.lua

      - name: Remove one-shot workflow and commit fix
        shell: bash
        run: |
          rm .github/workflows/one-shot-expand-lua-headroom.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SoloCraftBots.lua .github/workflows/one-shot-expand-lua-headroom.yml
          git commit -m "Expand Vanilla Lua local-variable headroom"
          git push origin HEAD:fix/lua-local-limit-2
