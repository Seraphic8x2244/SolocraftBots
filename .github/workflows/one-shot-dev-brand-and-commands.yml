name: One-shot dev branding and Commands.lua split

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/one-shot-dev-brand-and-commands.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Apply dev branding and extract commands module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path('SoloCraftBots.lua')
          toc_path = Path('SoloCraftBots.toc')
          text = main_path.read_text(encoding='utf-8')

          # Dev-only in-game header marker.
          old_title = 'title:SetText(SCB_L("ADDON_TITLE"))'
          new_title = 'title:SetText(SCB_L("ADDON_TITLE") .. " [DEV]")'
          if text.count(old_title) != 1:
              raise SystemExit('Could not locate unique in-game title line')
          text = text.replace(old_title, new_title, 1)

          start_marker = '-- -------------------------------------------------------------------------\n-- Direct command matrix\n-- -------------------------------------------------------------------------'
          end_marker = '-- -------------------------------------------------------------------------\n-- Presets\n-- -------------------------------------------------------------------------'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate command section boundaries')

          commands_body = text[start:end].rstrip() + '\n'
          commands_text = (
              '-- SoloCraft Bots - Direct commands and raid marks\n'
              '-- Loaded after SoloCraftBots.lua; intentionally behavior-preserving.\n\n'
              'local SCB = SoloCraftBots\n\n'
              + commands_body
          )

          main_text = text[:start].rstrip() + '\n\n' + text[end:]
          main_path.write_text(main_text, encoding='utf-8')
          Path('Commands.lua').write_text(commands_text, encoding='utf-8')

          toc = toc_path.read_text(encoding='utf-8')
          if '## Title: SoloCraft Bots\n' not in toc:
              raise SystemExit('Unexpected TOC title')
          toc = toc.replace('## Title: SoloCraft Bots\n', '## Title: SoloCraft Bots [DEV]\n', 1)

          old_load = 'SoloCraftBots.lua\nOptions.lua\nDebug.lua\nBindings.xml'
          new_load = 'SoloCraftBots.lua\nCommands.lua\nOptions.lua\nDebug.lua\nBindings.xml'
          if toc.count(old_load) != 1:
              raise SystemExit('Unexpected TOC load order')
          toc = toc.replace(old_load, new_load, 1)
          toc_path.write_text(toc, encoding='utf-8')
          PY

      - name: Compile all Lua modules
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          luac5.1 -p SoloCraftBots.lua
          luac5.1 -p Commands.lua
          luac5.1 -p Options.lua
          luac5.1 -p Debug.lua

      - name: Verify branding, split boundaries and load order
        shell: bash
        run: |
          grep -Fq '## Title: SoloCraft Bots [DEV]' SoloCraftBots.toc
          grep -Fq '## Version: 0.4.43-dev' SoloCraftBots.toc
          grep -Fq 'title:SetText(SCB_L("ADDON_TITLE") .. " [DEV]")' SoloCraftBots.lua
          ! grep -q '^-- Direct command matrix$' SoloCraftBots.lua
          grep -q '^-- Direct command matrix$' Commands.lua
          grep -q '^function SCB_DirectCommandOnClick()' Commands.lua
          grep -q '^function SCB_RaidMarkOnClick()' Commands.lua
          grep -q '^-- Presets$' SoloCraftBots.lua
          test "$(grep -n '^SoloCraftBots.lua$' SoloCraftBots.toc | cut -d: -f1)" -lt "$(grep -n '^Commands.lua$' SoloCraftBots.toc | cut -d: -f1)"
          test "$(grep -n '^Commands.lua$' SoloCraftBots.toc | cut -d: -f1)" -lt "$(grep -n '^Options.lua$' SoloCraftBots.toc | cut -d: -f1)"

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/one-shot-dev-brand-and-commands.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SoloCraftBots.lua Commands.lua SoloCraftBots.toc .github/workflows/one-shot-dev-brand-and-commands.yml
          git commit -m "Mark dev build and split command logic"
          git push origin HEAD:dev
