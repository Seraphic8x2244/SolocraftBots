name: Temporary SCB UI 0.5.7 build

on:
  push:
    branches:
      - tmp/ui-057c

permissions:
  contents: write

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/ui-057c
          fetch-depth: 0

      - name: Apply UI changes
        shell: python
        run: |
          from pathlib import Path

          p = Path('Commands.lua')
          s = p.read_text()
          assert '    local toggleSize = 22\n' in s, 'Assignments toggle size not found'
          p.write_text(s.replace('    local toggleSize = 22\n', '    local toggleSize = 18\n', 1))

          p = Path('Comms.lua')
          s = p.read_text()
          old = '    local roster, menu, button, count, i, info\n'
          new = '    local roster, menu, button, count, i, info, classInfo, classColor\n'
          assert old in s, 'target menu locals not found'
          s = s.replace(old, new, 1)

          old = '''            if not button then\n                button = SCB_CreateTextButton(menu, nil, 142, 20, "")\n                button:SetScript("OnClick", SCB_CommsTargetChoiceOnClick)\n                menu.buttons[count] = button\n            end\n'''
          new = '''            if not button then\n                button = SCB_CreateTextButton(menu, nil, 142, 20, "")\n                button.scbClassIcon = button:CreateTexture(nil, "ARTWORK")\n                button.scbClassIcon:SetWidth(16)\n                button.scbClassIcon:SetHeight(16)\n                button.scbClassIcon:SetPoint("LEFT", button, "LEFT", 4, 0)\n                button.label:ClearAllPoints()\n                button.label:SetPoint("LEFT", button.scbClassIcon, "RIGHT", 4, 0)\n                button.label:SetJustifyH("LEFT")\n                button:SetScript("OnClick", SCB_CommsTargetChoiceOnClick)\n                menu.buttons[count] = button\n            end\n'''
          assert old in s, 'target button creation block not found'
          s = s.replace(old, new, 1)

          old = '''            button:ClearAllPoints()\n            button:SetPoint("TOPLEFT", menu, "TOPLEFT", 4, -4 - ((count - 1) * 20))\n            button.label:SetText(info.name)\n            button.scbTargetName = info.name\n            button:Show()\n'''
          new = '''            button:ClearAllPoints()\n            button:SetPoint("TOPLEFT", menu, "TOPLEFT", 4, -4 - ((count - 1) * 20))\n            classInfo = info.classToken and SCB_FindClass(string.lower(info.classToken)) or nil\n            if classInfo and button.scbClassIcon then\n                button.scbClassIcon:SetTexture(SCB.assetRoot .. classInfo.icon)\n                button.scbClassIcon:Show()\n            elseif button.scbClassIcon then\n                button.scbClassIcon:Hide()\n            end\n            classColor = RAID_CLASS_COLORS and info.classToken and RAID_CLASS_COLORS[info.classToken] or nil\n            if classColor then\n                button.label:SetTextColor(classColor.r, classColor.g, classColor.b, 1)\n            else\n                button.label:SetTextColor(1, 1, 1, 1)\n            end\n            button.label:SetText(info.name)\n            button.scbTargetName = info.name\n            button:Show()\n'''
          assert old in s, 'target button display block not found'
          p.write_text(s.replace(old, new, 1))

          p = Path('SoloCraftBots.toc')
          s = p.read_text()
          assert '## Version: 0.5.6-dev' in s, 'expected dev version not found'
          p.write_text(s.replace('## Version: 0.5.6-dev', '## Version: 0.5.7-dev', 1))

      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1

      - name: Lua 5.1 syntax check
        run: |
          for f in SoloCraftBots.lua Roster.lua Comms.lua Commands.lua Options.lua Debug.lua Locale/enGB.lua Locale/enUS.lua; do
            luac5.1 -p "$f"
          done

      - name: Verify UI changes
        shell: python
        run: |
          from pathlib import Path
          commands = Path('Commands.lua').read_text()
          comms = Path('Comms.lua').read_text()
          toc = Path('SoloCraftBots.toc').read_text()
          assert 'local toggleSize = 18' in commands
          assert 'button.scbClassIcon:SetWidth(16)' in comms
          assert 'RAID_CLASS_COLORS[info.classToken]' in comms
          assert 'SCB_FindClass(string.lower(info.classToken))' in comms
          assert '## Title: SoloCraft Bots [dev]' in toc
          assert '## Version: 0.5.7-dev' in toc

      - name: Remove temporary workflow and commit clean staged tree
        run: |
          rm .github/workflows/tmp-ui-057c.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Commands.lua Comms.lua SoloCraftBots.toc .github/workflows/tmp-ui-057c.yml
          git commit -m "Refine assignment controls and preset target picker"
          git push
