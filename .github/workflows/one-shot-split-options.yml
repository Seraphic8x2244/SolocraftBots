name: One-shot Options.lua split

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/one-shot-split-options.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Extract options drawer module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path('SoloCraftBots.lua')
          toc_path = Path('SoloCraftBots.toc')
          text = main_path.read_text(encoding='utf-8')

          start_marker = '-- -------------------------------------------------------------------------\n-- Options drawer\n-- -------------------------------------------------------------------------'
          end_marker = '-- -------------------------------------------------------------------------\n-- Escape / top-level visibility\n-- -------------------------------------------------------------------------'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate options section boundaries')

          options_body = text[start:end].rstrip() + '\n'
          options_text = (
              '-- SoloCraft Bots - Options drawer\n'
              '-- Loaded after SoloCraftBots.lua; intentionally behavior-preserving.\n\n'
              'local SCB = SoloCraftBots\n\n'
              + options_body
          )

          main_text = text[:start].rstrip() + '\n\n' + text[end:]
          main_path.write_text(main_text, encoding='utf-8')
          Path('Options.lua').write_text(options_text, encoding='utf-8')

          toc = toc_path.read_text(encoding='utf-8')
          old = 'SoloCraftBots.lua\nDebug.lua\nBindings.xml'
          new = 'SoloCraftBots.lua\nOptions.lua\nDebug.lua\nBindings.xml'
          if toc.count(old) != 1:
              raise SystemExit('Unexpected TOC layout')
          toc_path.write_text(toc.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Compile Lua modules
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          luac5.1 -p SoloCraftBots.lua
          luac5.1 -p Options.lua
          luac5.1 -p Debug.lua

      - name: Verify split boundaries and load order
        shell: bash
        run: |
          ! grep -q '^-- Options drawer$' SoloCraftBots.lua
          grep -q '^-- Options drawer$' Options.lua
          grep -q '^function SCB_CreateOptionsUI(frame)' Options.lua
          grep -q '^function SCB_SetOptionsPanelShown(show)' Options.lua
          grep -q '^function SCB_SetDeveloperDebugEnabled(enabled)' Options.lua
          grep -q '^-- Escape / top-level visibility$' SoloCraftBots.lua
          test "$(grep -n '^SoloCraftBots.lua$' SoloCraftBots.toc | cut -d: -f1)" -lt "$(grep -n '^Options.lua$' SoloCraftBots.toc | cut -d: -f1)"
          test "$(grep -n '^Options.lua$' SoloCraftBots.toc | cut -d: -f1)" -lt "$(grep -n '^Debug.lua$' SoloCraftBots.toc | cut -d: -f1)"

      - name: Remove one-shot workflow and commit split
        shell: bash
        run: |
          rm .github/workflows/one-shot-split-options.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SoloCraftBots.lua Options.lua SoloCraftBots.toc .github/workflows/one-shot-split-options.yml
          git commit -m "Split options drawer into Options.lua"
          git push origin HEAD:dev
