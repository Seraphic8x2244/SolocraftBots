name: SCB one-shot roster consolidation

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Absorb Detection into Raid
        shell: python
        run: |
          from pathlib import Path

          raid_path = Path("Raid.lua")
          detection_path = Path("Detection.lua")
          toc_path = Path("SoloCraftBots.toc")
          workflow_path = Path(".github/workflows/scb-consolidate.yml")

          raid = raid_path.read_text(encoding="utf-8")
          detection = detection_path.read_text(encoding="utf-8")
          merged = (
              raid.rstrip("\n")
              + "\n\n-- -------------------------------------------------------------------------\n"
              + "-- Combat role detection (absorbed from Detection.lua in 0.8.30).\n"
              + "-- Keep this scoped block to preserve the former file's local namespace.\n"
              + "-- -------------------------------------------------------------------------\n\n"
              + "do\n"
              + detection.rstrip("\n")
              + "\nend\n"
          )
          raid_path.write_text(merged, encoding="utf-8")
          detection_path.unlink()

          toc = toc_path.read_text(encoding="utf-8")
          toc = toc.replace("## Version: 0.8.29-dev", "## Version: 0.8.30-dev", 1)
          toc = toc.replace("Raid.lua\nDetection.lua\nRaidPlayers.lua", "Raid.lua\nRaidPlayers.lua", 1)
          toc_path.write_text(toc, encoding="utf-8")

          workflow_path.unlink()

      - name: Commit clean candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Absorb role detection into Raid"
          git push origin HEAD:dev
