name: One-shot Auto Loot fix

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/one-shot-fix-auto-loot.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Patch files
        run: python .github/scripts/fix_auto_loot.py
      - name: Compile Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          luac5.1 -p SoloCraftBots.lua
          luac5.1 -p Commands.lua
          luac5.1 -p Options.lua
          luac5.1 -p Debug.lua
      - name: Verify
        run: |
          grep -q '^function SCB_QueueAutoLootApply()' SoloCraftBots.lua
          grep -q 'SCB_QueueAutoLootApply()' Options.lua
          grep -q 'IsPartyLeader and not IsPartyLeader()' SoloCraftBots.lua
      - name: Commit fix
        run: |
          rm .github/workflows/one-shot-fix-auto-loot.yml
          rm .github/scripts/fix_auto_loot.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SoloCraftBots.lua Options.lua .github/workflows/one-shot-fix-auto-loot.yml .github/scripts/fix_auto_loot.py
          git commit -m "Fix Auto Loot application timing"
          git push origin HEAD:dev
